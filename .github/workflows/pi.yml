name: Pi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Read profile ID or retry the verified current-version draft after its Contributor grant
        type: choice
        options: [profile, retry-pending-release]
        default: profile

permissions:
  contents: read

concurrency:
  group: pi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  pi-quality:
    name: pi-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.11.1
      - name: Bind source and install locked dependencies
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          npm ci
          npm ci --prefix .github/pi-sdk --install-strategy=nested
          echo "$GITHUB_WORKSPACE/.github/pi-sdk/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PI_SRC=$GITHUB_WORKSPACE/.github/pi-sdk/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Source types
        run: npx --no-install tsc -p tsconfig.json --noEmit
      - name: Test types
        run: npx --no-install tsc -p test/tsconfig.json --noEmit
      - name: Non-clean build
        run: node scripts/build.mjs
      - name: Coverage contract
        run: npm run validate:coverage
      - name: Unit
        run: npm run test:unit
      - name: Integration
        run: npm run test:integration
      - name: Real Pi
        run: npm run smoke:real-pi
      - name: VS Code extension host
        env:
          PI_TEST_VSCODE_VERSION: 1.141.0
        run: xvfb-run -a npm run test:extension
      - name: Host drift
        run: npm run check:drift
      - name: Package and inspect stable VSIX
        run: |
          mkdir -p "$RUNNER_TEMP/pi-release"
          npx --no-install vsce package --no-dependencies --out "$RUNNER_TEMP/pi-release/pi.vsix"
          node scripts/inspect-vsix.mjs "$RUNNER_TEMP/pi-release/pi.vsix" "$RUNNER_TEMP/pi-release/receipt.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/pi-release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish stable Pi
    needs: pi-quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'mr-narender/Pi'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.pi-quality.outputs.source-sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.11.1
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pi-${{ needs.pi-quality.outputs.source-sha }}
          path: ${{ runner.temp }}/pi-release/
      - name: Sign in with main-only workload identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.0.0
        env:
          AZURE_CORE_OUTPUT: json
          AZURE_CONFIG_DIR: ${{ runner.temp }}/pi-azure
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the verified artifact
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/pi-azure
          GH_TOKEN: ${{ github.token }}
          PI_PREVIOUS_SHA: ${{ github.event.before }}
          PI_RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/release.mjs "$RUNNER_TEMP/pi-release"
