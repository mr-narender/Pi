    <div class="layout" data-testid="chat-app" data-ui-mode="simple">

      <section class="composer-dock" aria-labelledby="composer-heading">
        <h2 id="composer-heading" class="visually-hidden">Message Pi</h2>
        <label class="visually-hidden" for="composer-field">Message π</label>
        
        
        
        <div class="composer-card" aria-busy="false">
          <textarea id="composer-field" rows="3" placeholder="Ask π to edit…" disabled></textarea>

              <button type="button" class="icon-button" data-command="piRpc.showPiCommands" title="Commands" aria-label="Commands" disabled>/</button>
            </div>
            <div class="composer-actions-right">
              
              
              <button type="button" id="composer-send-button" class="send-button" data-send-command="prompt" title="Send (Enter · Shift+Enter for newline)" aria-label="Send (Enter · Shift+Enter for newline)" disabled><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4v3a1.5 1.5 0 0 1-1.5 1.5H4.5"/><path d="M7 6L4.3 8.5 7 11"/></svg></button>
            </div>
          </div>
        </div>
